function buildTrack(key, wearScale){
  const C=CIRCUITS[key]; const seg=C.seg.map(a=>a.slice());
  // 1) heading closure: scale all right-hand arc angles so that total turning = +360° (clockwise lap)
  let sumR=0,sumL=0; seg.forEach(sg=>{ if(sg[0]==='R') sumR+=sg[1]; else if(sg[0]==='L') sumL+=sg[1]; });
  const alpha=(360+sumL)/sumR; seg.forEach(sg=>{ if(sg[0]==='R') sg[1]*=alpha; });
  // 2) position closure: every straight is flexible; minimal relative change (weights = length^2) so that the end point returns to the start
  function sim(lens,step){
    let x=0,z=0,psi=90*D2R, pts=[], dirs=[]; let si=0;
    for(const sg of seg){
      if(sg[0]==='S'){ const len=lens[si++]; dirs.push([Math.sin(psi),-Math.cos(psi)]);
        const n=Math.max(1,Math.ceil(len/step)); for(let i=0;i<n;i++){ x+=Math.sin(psi)*len/n; z+=-Math.cos(psi)*len/n; pts.push([x,z,psi,0]); } }
      else { const sgn=sg[0]==='R'?1:-1, ang=sg[1]*D2R, r=sg[2], arcLen=ang*r, n=Math.max(2,Math.ceil(arcLen/step)); const da=ang/n*sgn;
        for(let i=0;i<n;i++){ const mid=psi+da/2, chord=2*r*Math.sin(Math.abs(da)/2); x+=Math.sin(mid)*chord; z+=-Math.cos(mid)*chord; psi+=da; pts.push([x,z,psi,sgn/r]); } }
    }
    return {x:x,z:z,psi:psi,pts:pts,dirs:dirs};
  }
  let lens=seg.filter(sg=>sg[0]==='S').map(sg=>sg[1]); const lens0=lens.slice(); const fixed=new Array(lens.length).fill(false); const LO=0.12;
  for(let it=0;it<40;it++){
    const e=sim(lens,5), dirs=e.dirs, n=lens.length; let a11=0,a12=0,a22=0;
    for(let i=0;i<n;i++){ if(fixed[i]) continue; const w=lens0[i]*lens0[i]; a11+=w*dirs[i][0]*dirs[i][0]; a12+=w*dirs[i][0]*dirs[i][1]; a22+=w*dirs[i][1]*dirs[i][1]; }
    const det=a11*a22-a12*a12; if(Math.abs(det)<1e-9||Math.hypot(e.x,e.z)<0.3) break; const bx=-e.x, bz=-e.z;
    const lx=(a22*bx-a12*bz)/det, lz=(-a12*bx+a11*bz)/det; let hit=false;
    for(let i=0;i<n;i++){ if(fixed[i]) continue; const w=lens0[i]*lens0[i]; let nl=lens[i]+w*(dirs[i][0]*lx+dirs[i][1]*lz);
      if(nl<lens0[i]*LO){ nl=lens0[i]*LO; fixed[i]=true; hit=true; } lens[i]=nl; }
  }
  const fin=sim(lens,0.5); const res=Math.hypot(fin.x,fin.z); let minRatio=9,maxRatio=0; lens.forEach((l,i)=>{ const r=l/lens0[i]; minRatio=Math.min(minRatio,r); maxRatio=Math.max(maxRatio,r); });
  const flex={minRatio:minRatio,maxRatio:maxRatio,alpha:alpha};
  // 3) spread the leftover position error along the lap (linear drift correction)
  const raw=fin.pts; const n0=raw.length; let cum=[0]; for(let i=1;i<n0;i++) cum.push(cum[i-1]+Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]));
  const Lraw=cum[n0-1]+Math.hypot(raw[0][0]-raw[n0-1][0],raw[0][1]-raw[n0-1][1]);
  const px=raw.map((p,i)=>p[0]-fin.x*cum[i]/Lraw), pz=raw.map((p,i)=>p[1]-fin.z*cum[i]/Lraw);
  // 4) scale to the real lap length and resample at uniform spacing
  const sc=C.length/Lraw; const N=Math.round(C.length/2), ds=C.length/N;
  const X=new Float32Array(N),Z=new Float32Array(N),PSI=new Float32Array(N),K=new Float32Array(N);
  let j=0;
  for(let i=0;i<N;i++){ const target=i*ds/sc; while(j<n0-2&&cum[j+1]<target) j++; const t=CLAMP((target-cum[j])/Math.max(1e-6,cum[j+1]-cum[j]),0,1);
    X[i]=LERP(px[j],px[j+1],t)*sc; Z[i]=LERP(pz[j],pz[j+1],t)*sc; }

  for(let i=0;i<N;i++){ const a=(i+3)%N, b=(i-3+N)%N; let dp=PSI[a]-PSI[b]; while(dp>Math.PI) dp-=2*Math.PI; while(dp<-Math.PI) dp+=2*Math.PI; K[i]=dp/(6*ds); }
  const Ks=new Float32Array(N); for(let i=0;i<N;i++){ let s=0; for(let k=-4;k<=4;k++) s+=K[(i+k+N)%N]; Ks[i]=s/9; }

  T.wearScale=wearScale||1;

    const t=$('touch'); const showT=CFG.touch||CFG.tilt; t.style.display=showT?'block':'none'; if(showT) buildTouch(); if(CFG.tilt){ setTimeout(tiltCalib,1500); let fbDone=false; const fb=()=>{ if(!tilt.got&&!fbDone){ fbDone=true; raceMsg(tilt.denied?'החיישן חסום — עברתי לכפתורי מגע. להטיה נדרש אתר https ואישור "חיישני תנועה"':'חיישן ההטיה לא זמין (בקובץ מקומי הדפדפן חוסם אותו) — עברתי לכפתורי מגע',6000,'bad'); CFG.tilt=false; buildTouch(); CFG.touch=true; saveCfg(); } }; setTimeout(()=>{ if(tilt.denied) fb(); },900); setTimeout(fb,3500); }
    $('hud').style.display='block'; $('loading').style.display='none'; running=true; paused=false; last=performance.now();
    raceMsg(CFG.mode==='race'?'ברוכים הבאים ל-'+R.T.name+' — מוכנים לזינוק':'בהצלחה!',3500);
  }catch(err){ $('loading').style.display='none'; $('menu').style.display='flex'; console.error(err); alert('שגיאה בטעינה: '+(err&&err.message)); } },40);
}
function buildTouch(){ const t=$('touch'); t.innerHTML=''; document.body.classList.add('tch'); const mk=(id,txt,css,fn)=>{ const d=document.createElement('div'); d.className='b'; d.style.cssText=css; d.textContent=txt; const on=(v)=>{ touch[id]=v; d.classList.toggle('on',v); }; d.style.touchAction='none'; d.style.userSelect='none'; d.style.webkitUserSelect='none'; d.style.webkitTouchCallout='none'; d.addEventListener('contextmenu',e=>e.preventDefault()); d.addEventListener('touchstart',e=>{ e.preventDefault(); on(true); },{passive:false}); d.addEventListener('touchend',e=>{ e.preventDefault(); on(false); },{passive:false}); d.addEventListener('touchcancel',()=>on(false)); d.addEventListener('mousedown',e=>{ e.preventDefault(); on(true); }); for(const ev of ['mouseup','mouseleave']) d.addEventListener(ev,()=>on(false)); t.appendChild(d); };
  if(!CFG.tilt){ mk('l','◀','left:14px;bottom:90px;width:92px;height:92px'); mk('r','▶','left:120px;bottom:90px;width:92px;height:92px'); mk('gas','GAS','right:14px;bottom:100px;width:110px;height:130px;background:rgba(47,224,106,.22)'); mk('brk','BRK','right:134px;bottom:100px;width:96px;height:96px;background:rgba(255,59,48,.22)'); }
  const sm=(txt,css,fn)=>{ const d=document.createElement('div'); d.className='b'; d.style.cssText=css+';width:58px;height:42px;font-size:14px'; d.textContent=txt; d.style.touchAction='none'; d.addEventListener('touchstart',e=>{ e.preventDefault(); fn(); },{passive:false}); d.addEventListener('mousedown',e=>{ e.preventDefault(); fn(); }); t.appendChild(d); };
  sm('⏸','top:56px;left:calc(50% - 136px)',togglePause); sm('RST','top:56px;left:calc(50% - 70px)',doReset); sm('CAM','top:56px;left:calc(50% - 4px)',cycleCam); sm('DRS','top:56px;left:calc(50% + 62px)',()=>{ one.drs=true; }); if(CFG.tilt) sm('CAL','top:56px;left:calc(50% + 128px)',tiltCalib); mk('boost','ERS','left:120px;bottom:192px;width:92px;height:44px;font-size:15px'); }
function showResults(){ const R=RACE,H=R.H; const o=R.order; let h='<div class="pbox"><h2>🏁 תוצאות — '+R.T.name+'</h2><div style="color:#9aa;margin-bottom:6px">מקומך: <b style="color:#fff">P'+H.rank+'</b> · שיא הקפה: '+fmtT(H.bestLap)+(H.penTime?' · פנדלטי: +'+H.penTime+'s':'')+'</div><table id="rtab">'; const lead=o[0];
  o.slice(0,20).forEach((c,i)=>{ const tm=c.finished?(i===0?fmtT(c.finTime):'+'+(c.finTime-lead.finTime).toFixed(3)):(c.prog<lead.prog-R.Lt*0.9?'+'+Math.round((lead.prog-c.prog)/R.Lt)+'L':'DNF'); h+='<tr class="'+(c.isH?'me':'')+'"><td>'+(i+1)+'</td><td>'+(c.isH?'YOU':c.code)+'</td><td>'+TEAMS[c.team%10].n+'</td><td>'+tm+'</td></tr>'; });
  h+='</table><button class="pri" onclick="F1.restart()">מרוץ חוזר</button><button onclick="F1.menu()">חזרה לתפריט</button></div>'; $('results').innerHTML=h; $('results').style.display='flex'; }
window.F1={ resume:()=>togglePause(), restart:()=>{ $('pause').style.display='none'; $('results').style.display='none'; paused=false; startRace(); }, menu:()=>showMenu(), cam:()=>{ cycleCam(); } };

// ---------- contacts ----------
let lastHit=0, stuckT=0;
function collide(H,R){ const fx=Math.sin(H.psi), fz=-Math.cos(H.psi), rx=Math.cos(H.psi), rz=Math.sin(H.psi);
  for(const A of R.ais){ const dx=A.x-H.x, dz=A.z-H.z; if(dx*dx+dz*dz>64) continue; const lf=dx*fx+dz*fz, lr=dx*rx+dz*rz; if(Math.abs(lf)>5.0||Math.abs(lr)>1.95) continue; if(R.state!=='racing') continue;
    const rel=H.u-A.v; const sgn=lr>=0?1:-1;
    if(Math.abs(lf)>3.3){ const pen=5.0-Math.abs(lf); if(lf>0){ H.x-=fx*pen; H.z-=fz*pen; if(rel>0) H.u=Math.max(0,A.v+0.0*rel); } else { A.v+=Math.max(0,-rel)*0.4; H.x+=fx*pen*0.3; H.z+=fz*pen*0.3; } }
    else { const ov=1.95-Math.abs(lr); H.x-=rx*sgn*ov*0.6; H.z-=rz*sgn*ov*0.6; A.d+=sgn*ov*0.4; H.r*=0.85; H.v-=sgn*ov*0.8; }
    const sev=Math.min(1,Math.abs(rel)/25+0.05); H.wingDmg=Math.min(1,H.wingDmg+sev*0.35*(Math.abs(lf)>3.3?1:0.4)); H.floorDmg=Math.min(1,H.floorDmg+sev*0.1); H.impact=Math.max(H.impact,Math.abs(rel)*0.5);
    if(R.t-lastHit>0.8){ lastHit=R.t; raceMsg('CONTACT!',1500,'bad'); thump(0.25+sev); for(let k=0;k<10;k++) emit(partSpark,H.x+rx*lr*0.5,(H.elev||0)+0.2,H.z+rz*lr*0.5,(Math.random()-0.5)*8,Math.random()*4,(Math.random()-0.5)*8,0.5,1,0.8,0.3); } } }

// ---------- main loop ----------
let last=0, acc=0, hitCool=0, bestSaved=null;
function frame(now){ requestAnimationFrame(frame); if(!running||paused||!renderer) return; let dt=Math.min(0.05,(now-last)/1000); last=now; if(dt<=0) return;
  const R=RACE,H=R.H,T=R.T; let ey=H.elev||0; const inp=readInput();
  // human state & physics
  let inp2=inp; const st=R.state;
  if(one.drs){ one.drs=false; if(st==='racing'||st==='flying'){ if(H.drsOpen){ H.drsOpen=false; } else if(H.drsAvail){ H.drsOpen=true; raceMsg('DRS OPEN',1200,'good'); } } }
  inp2.shiftUp=one.up; inp2.shiftDown=one.dn; one.up=false; one.dn=false; H.boost=one.boost;
  raceFrame(dt,inp);
  if(st==='racing'||st==='flying'||R.state==='racing'||R.state==='flying'||R.state==='finished'){
    if(R.state==='finished'){ inp2=autoDrive(H,T,vpSlow,0.75); inp2.thr*=0.8; H.pitLim=0; }
    if(H.servicing){ inp2={thr:0,brk:1,steer:0}; }
    acc+=dt; let n=0; const prevWall=H.wall; while(acc>=1/240&&n<8){ stepCar(H,inp2,1/240,T); acc-=1/240; n++; } if(acc>1/60) acc=0;
    if(H.wall&&!prevWall){ thump(Math.min(1,H.impact/18)); for(let k=0;k<16;k++) emit(partSpark,H.x,ey+0.25,H.z,(Math.random()-0.5)*12,Math.random()*5,(Math.random()-0.5)*12,0.6,1,0.75,0.25); if(H.impact>5) raceMsg('IMPACT',1200,'bad'); }
    H.wallHit=H.wall; collide(H,R);
  } else { H.u=0;H.v=0;H.r=0; H.speedKmh=0; }
  // visuals human
  const o0=carObjs[0]; const ay=CLAMP(H.ay,-45,45), ax=CLAMP(H.ax,-30,30);
  H.spinV=(H.spinV||0)-(Math.max(0,H.u)/0.35)*dt; const kb=H.surf==='kerb'?Math.sin(R.t*70)*0.012:0;
  ey=H.elev||0; o0.u=H.u; setCarCompound(o0,H.compound); placeCar(o0,H.x,H.z,H.psi,H.steer,H.spinV,H.brk,kb+ey,ax*0.0016+Math.atan(H.slopeV||0)*0.9,ay*0.0011);
  if(o0.blob) o0.blob.position.y=0.09-kb;
  // AI visuals
  for(let i=0;i<R.ais.length;i++){ const A=R.ais[i],o=carObjs[i+1]; if(!o) continue; setCarCompound(o,A.compound); A.sp=(A.sp||0)-(A.v/0.35)*dt; o.u=A.v; placeCar(o,A.x,A.z,A.psi,A.steer*0.8,A.sp,A.brk,elevAt(T,A.s),Math.atan(slopeAt(T,A.s))*0.9,0); if(o.wheels[0].mesh.material&&A.compound&&A.cmpCache!==A.compound){ A.cmpCache=A.compound; } }
  // ghost
  if(ghostObj){ const g=R.ghostBest; if(g&&H.timing&&g.length>2){ const el=R.t-H.lapStart; const k=Math.floor(el/0.05); if(k<g.length){ const p=g[k]; ghostObj.grp.visible=true; placeCar(ghostObj,p[0],p[1],p[2],0,0,0,ey+0.02); } else ghostObj.grp.visible=false; } else ghostObj.grp.visible=false; }
  // smoke / dust
  const sp=Math.max(0,H.u); const slipR=Math.abs(H.slipR)*Math.min(1,sp/18); if(sp>4&&(slipR>0.13||H.lockF||H.spin)){ const k=R.t*1000|0; const rx=Math.cos(H.psi), rz=Math.sin(H.psi), fx=Math.sin(H.psi), fz=-Math.cos(H.psi); for(const sd of [-1,1]){ emit(partSmoke,H.x+rx*0.8*sd-fx*1.64,ey+0.25,H.z+rz*0.8*sd-fz*1.64,(Math.random()-0.5)*1.2,0.8+Math.random()*0.8,(Math.random()-0.5)*1.2,1.3,0.82,0.82,0.84); } }
  if(H.surf==='grass'&&sp>6&&Math.random()<0.7){ const rx=Math.cos(H.psi), rz=Math.sin(H.psi), fx=Math.sin(H.psi), fz=-Math.cos(H.psi); emit(partSmoke,H.x-fx*1.6+rx*(Math.random()-0.5)*1.6,ey+0.2,H.z-fz*1.6+rz*(Math.random()-0.5)*1.6,(Math.random()-0.5)*2,1.5,(Math.random()-0.5)*2,1.0,0.35,0.5,0.25); }
  updateParticles(partSmoke,dt,-0.6,f=>[0.8*f+0.1,0.8*f+0.1,0.8*f+0.1]); updateParticles(partSpark,dt,12,f=>[f,f*0.7,f*0.25]);
  // sun/clouds drift
  skyMesh.children.forEach(c=>{ if(c.userData.cloud) c.position.x+=dt*4; });
  { const fx2=Math.sin(H.psi), fz2=-Math.cos(H.psi); sunL.target.position.set(H.x+fx2*30,ey,H.z+fz2*30); sunL.position.set(H.x+fx2*30-270,ey+450,H.z+fz2*30+180); }
  updateCamera(dt);
  // audio
  let rival=null; let bd=1e9; for(const A of R.ais){ const d=Math.hypot(A.x-H.x,A.z-H.z); if(d<bd){ bd=d; rival={dist:d,rpm:A.rpm||9000,rel:A.v-H.u,px:(A.x-H.x)*Math.cos(H.psi)+(A.z-H.z)*Math.sin(H.psi)}; } } if(R.state==='lights'||R.state==='grid'){ H.rpm=H.rpm; } audioUpdate(H,R.mode==='race'?rival:null,dt,camMode);
  // HUD (throttled)
  stuckT=(R.state==='racing'&&H.u<0.6&&!H.rev&&!H.hold&&(H.surf!=='asphalt'||H.wall))?stuckT+dt:0; if(stuckT>3.5){ stuckT=0; raceMsg('תקוע? החזק בלם בעמידה כדי לנסוע אחורה',3000); }
  hudAcc+=dt; if(hudAcc>0.066){ hudAcc=0; updateHUD(dt); if(camMode===2) updateWheelScreen(H,R); }
  if(H.bestLap&&H.bestLap!==bestSaved){ bestSaved=H.bestLap; setBest(R.T.key,H.bestLap); }
  if(R.results&&$('results').style.display!=='flex'){ showResults(); }
  POST.speed=H.u; if(!POST.render()) renderer.render(scene,camera); try{ ENG.update(dt); }catch(e){}
}
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&running&&!paused) togglePause(); });
buildMenu(); requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }


})();
